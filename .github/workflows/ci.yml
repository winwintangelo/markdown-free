# CI — typecheck, production build, and the full Playwright e2e suite against
# that build (build plan Phase −1). Runs on every PR and on pushes to main.
#
# The suite generates real PDFs/DOCX/EPUB through the API routes, so it needs
# the dev Puppeteer Chromium (installed by `npm ci`) plus Playwright's Chromium
# and WebKit (WebKit is mandatory for image-export.spec.ts — Safari's canvas
# limits are the binding constraint for the image split logic).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Intent-page stubs match the manifest
        # The route files are generated from src/content/intent-pages/manifest.json;
        # this fails if someone edits the manifest without re-running the generator.
        run: node scripts/generate-intent-pages.mjs --check

      - name: Build (production)
        run: npm run build

      - name: E2E against the production build
        # playwright.config.ts starts `npm run start` when CI is set.
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tmp/playwright-report
          retention-days: 14
